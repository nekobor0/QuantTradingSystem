<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>75%股息 + 25%波动率模拟仓</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;margin:24px;background:#f5f7fa;color:#1f2937}h1{font-size:22px}.bar,.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card,section{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px #0001}.card{min-width:150px}.label{font-size:12px;color:#6b7280}.value{font-size:20px;font-weight:650;margin-top:4px}button{padding:8px 14px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer}button.primary{background:#166534;color:#fff;border-color:#166534}.warn{color:#b45309}.bad{color:#b91c1c}.ok{color:#166534}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px;border-bottom:1px solid #e5e7eb;font-size:13px}pre{white-space:pre-wrap;font-size:12px}section{margin-top:14px}h2{font-size:16px;margin:0 0 10px}
</style>
</head>
<body>
<h1>模拟仓（75% 股息 + 25% 波动率趋势）</h1>
<p>仅模拟：收盘后生成计划，下一交易日开盘撮合；不连接券商、不提交订单。</p>
<div class="bar"><button class="primary" onclick="runDaily()">执行当日流程</button><button onclick="scan()">扫描信号</button><button onclick="updateData()">更新数据</button><button onclick="resetState()">重置 v2 模拟仓</button><button onclick="refresh()">刷新</button></div>
<div id="notice"></div><div class="cards" id="cards"></div>
<section><h2>待执行计划</h2><div id="plans">—</div></section>
<section><h2>本次结果 / 扫描</h2><pre id="result">尚未运行。</pre></section>
<section><h2>最近成交审计</h2><div id="fills">—</div></section>
<script>
const money=x=>Number(x||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw new Error(JSON.stringify(data));return data}
function planRow(name,p){if(!p)return `<tr><td>${name}</td><td colspan="4">无</td></tr>`;return `<tr><td>${name}</td><td>${esc(p.signal_date)}</td><td>${esc(p.execute_date)}</td><td>${esc(p.reason)}</td><td>${Object.keys(p.target_weights||{}).length} 只</td></tr>`}
function renderPlans(s){document.getElementById('plans').innerHTML=`<table><tr><th>分仓</th><th>信号日</th><th>执行日</th><th>原因</th><th>目标数</th></tr>${planRow('股息',s.dividend.pending_plan)}${planRow('波动率',s.voltrend.pending_plan)}</table>`}
function fillTable(rows){if(!rows.length)return '暂无成交';return `<table><tr><th>日期</th><th>分仓</th><th>方向</th><th>代码</th><th>股数</th><th>价格</th><th>费用</th></tr>${rows.slice(-30).reverse().map(x=>`<tr><td>${esc(x.trade_date)}</td><td>${esc(x.book)}</td><td>${esc(x.side)}</td><td>${esc(x.symbol)}</td><td>${x.shares}</td><td>${money(x.price)}</td><td>${money((x.commission||0)+(x.stamp_duty||0)+(x.dividend_tax||0))}</td></tr>`).join('')}</table>`}
async function refresh(){try{const [s,a]=await Promise.all([json('/api/state'),json('/api/audit')]);document.getElementById('notice').innerHTML=s.legacy_import?'<p class="bad">检测到旧版合成持仓：执行已硬阻断。请先备份 state.json，再重置 v2 模拟仓；旧两日记录仅作诊断证据。</p>':(s.warnings.length?`<p class="warn">${s.warnings.map(esc).join('；')}</p>`:'<p class="ok">v2 状态可执行</p>');document.getElementById('cards').innerHTML=`<div class="card"><div class="label">有效交易日</div><div class="value">${esc(s.effective_date)}</div></div><div class="card"><div class="label">总净值</div><div class="value">${money(s.total_nav)}</div></div><div class="card"><div class="label">股息分仓</div><div class="value">${money(s.dividend.nav)}</div></div><div class="card"><div class="label">波动率分仓</div><div class="value">${money(s.voltrend.nav)}</div></div><div class="card"><div class="label">风险仓位</div><div class="value">${(100*s.voltrend.position).toFixed(0)}%</div></div>`;renderPlans(s);const rows=[...a.dividend_fills.map(x=>({...x,book:'股息'})),...a.voltrend_fills.map(x=>({...x,book:'波动率'}))];document.getElementById('fills').innerHTML=fillTable(rows)}catch(e){document.getElementById('notice').innerHTML=`<p class="bad">刷新失败：${esc(e.message)}</p>`}}
async function act(url){try{const r=await json(url,{method:'POST'});document.getElementById('result').textContent=JSON.stringify(r,null,2);await refresh()}catch(e){document.getElementById('result').textContent='失败：'+e.message}}
function runDaily(){act('/api/run_daily')} function scan(){act('/api/scan')} function updateData(){act('/api/update_data')}
async function resetState(){if(confirm('确认已备份旧 state.json，并重置为空仓 v2 模拟账户？'))await act('/api/reset')}
refresh();
</script>
</body></html>
