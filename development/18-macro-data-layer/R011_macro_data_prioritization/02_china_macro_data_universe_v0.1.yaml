meta:
  title: China Macro Data Universe v0.1
  version: '0.1'
  as_of: '2026-08-25'
  language: zh-CN
  purpose: 供Codex/Agent构建中国宏观增量数据层、Point-in-Time数据库、宏观状态模型与Conditional Alpha研究使用。
  series_count: 145
  scope: 中国宏观、信用、流动性、财政、外贸、地产、价格、就业、产业实物量及社保机构持仓补充层；优先官方/法定披露来源。
  history_goal: 核心长期序列尽量覆盖2000-2005及更早；对不存在或口径不连续的序列不做伪回填。
  history_start_semantics: history_start_target表示采集目标/已知制度起点，不等于保证存在第一条机器可读记录。采集器必须探测实际first_non_null并写入manifest。
  lead_lag_semantics: 仅表示相对特定实体经济/政策链条的通常经济含义，不代表对股票收益天然具有预测能力。
hard_rules:
- 任何回测只能使用 available_ts <= decision_ts 的数据。
- 必须同时保存 observation_period、release_ts、available_ts、vintage_ts；禁止只存date/value。
- 原始值与派生特征分表；不得覆盖原始官方值。
- 遇到修订序列必须保留vintage；若拿不到历史vintage，明确标记vintage_unavailable并降低证据等级。
- 累计值转换单月值时必须记录公式和口径；工业/能源等样本范围变化时不得机械相减。
- 随机K-fold不用于宏观时序主验证；默认walk-forward/expanding-window。
- 领先/同步/滞后必须相对于target和horizon重新实证检验，不能作为静态真理。
- 官方网页优先级：结构化接口/XLS/CSV > HTML表格 > PDF；OCR仅最后手段。
- 每次抓取保存raw response、source_url、fetched_at、content_hash、parser_version。
- 遇到统计制度或基期变化，拆分regime或建立methodology_version，禁止静默拼接。
priority_definition:
  T1: 首批生产级：直接支持Growth/Inflation/Credit/Liquidity/Property/External核心状态。
  T2: 第二批研究级：增强结构解释、Nowcast和行业条件信号。
  T3: 补充层：低频、机构行为或特定风险指标。
frequency_definition:
  event: 不规则政策事件
  daily: 交易日/自然日日频
  monthly: 月度
  quarterly: 季度
  annual: 年度
source_registry:
  NBS_RELEASE:
    name: 国家统计局主要统计信息发布日程与发布稿
    authority: 国家统计局
    url: https://www.stats.gov.cn/xxgk/sjfb/fbrcb/
    access:
    - html
    - release_calendar
    pit_value: 高：用于确定实际发布时间；应与国家数据数值表配对
    notes: 2026发布日程注明：除PMI外一般发布上月/上季/上年或累计数据；国家数据数据库通常在发布后约3个工作日更新全部进度指标。
  NBS_DATA:
    name: 国家数据
    authority: 国家统计局
    url: https://data.stats.gov.cn/easyquery.htm
    access:
    - structured_web_query
    - html
    pit_value: 中高：历史值覆盖广，但必须另存发布时点与修订版本
    notes: 含月度、季度、年度、地区、部门等数据库。优先研究其网络请求/结构化接口，不建议脆弱DOM抓取。
  PBOC_STATS:
    name: 调查统计司统计数据与金融统计数据报告
    authority: 中国人民银行
    url: https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html
    access:
    - html
    - xls
    - pdf
    - release_article
    pit_value: 高：货币、信贷、社融需保存实际公告时间和口径注释
    notes: 社融增量2011年正式编制公布；官方提供可回溯到2002年的历史数据。口径有多次调整。
  PBOC_POLICY:
    name: 货币政策工具与公开市场操作
    authority: 中国人民银行
    url: https://www.pbc.gov.cn/zhengcehuobisi/125207/125213/index.html
    access:
    - html
    - release_article
    pit_value: 高：事件时间明确，适合事件研究
    notes: 用于OMO、MLF、降准降息、政策利率等事件型序列。
  MOF_FISCAL:
    name: 财政数据/全国财政收支情况
    authority: 财政部
    url: https://www.mof.gov.cn/gkml/caizhengshuju/
    access:
    - html
    - release_article
    - attachment
    pit_value: 高：按公告实际发布时间使用
    notes: 月度多为累计口径。历史网页结构有变化，需建立URL归档和解析器版本。
  CUSTOMS:
    name: 海关统计数据在线查询平台
    authority: 海关总署
    url: https://stats.customs.gov.cn/
    access:
    - structured_query
    - download
    pit_value: 中高：在线平台2018-11-01上线；更早历史需结合海关月报/年鉴归档
    notes: 可按商品、贸易伙伴、贸易方式、收发货人注册地等查询。抓取时注意参数字典与HS版本变更。
  SAFE:
    name: 国家外汇管理局统计数据
    authority: 国家外汇管理局
    url: https://www.safe.gov.cn/safe/tjsj1/index.html
    access:
    - html
    - xls
    - pdf
    - release_calendar
    pit_value: 高：官方每年给出主要统计数据发布时间表
    notes: 国际收支初步数自2009-08起增加发布；服务贸易自2014起按月公布，货物贸易自2015起按月公布；全口径银行结售汇自2013起按月公布。
  NEA:
    name: 能源数据与全社会用电量
    authority: 国家能源局
    url: https://www.nea.gov.cn/
    access:
    - html
    - release_article
    pit_value: 高：月度发布时间可从公告精确获取
    notes: 用于全社会及分产业用电量等实体经济高频代理变量。早期长期序列需与统计年鉴/原电力主管部门口径核验。
  MOT:
    name: 交通运输经济运行与统计公报
    authority: 交通运输部
    url: https://xxgk.mot.gov.cn/
    access:
    - html
    - pdf
    pit_value: 高：月度经济运行公告可确定可得时点
    notes: 货运量、港口吞吐、集装箱、交通投资等；历史统计口径和运输方式覆盖需逐段核验。
  CHINAMONEY:
    name: 中国货币网/全国银行间同业拆借中心
    authority: 全国银行间同业拆借中心（经授权的金融市场基础设施）
    url: https://www.chinamoney.com.cn/
    access:
    - html
    - structured_query
    - download
    pit_value: 高：日频市场利率及LPR适合严格按时间戳使用
    notes: Shibor自2007-01-04正式运行。LPR旧机制2013年起存在；2019-08-20起按改革后机制发布1年期和5年期以上LPR。
  CHINABOND:
    name: 中债收益率曲线
    authority: 中央国债登记结算有限责任公司（金融市场基础设施）
    url: https://yield.chinabond.com.cn/
    access:
    - structured_query
    - download
    pit_value: 高：日频利率曲线
    notes: 中债国债收益率曲线历史较长；财政部自2014-11起每日发布关键期限国债收益率。实际可回溯起点由采集器探测并记录。
  SSF:
    name: 全国社会保障基金年度报告
    authority: 全国社会保障基金理事会
    url: https://www.ssf.gov.cn/portal/xxgk/fdzdgknr/cwbg/sbjjndbg/
    access:
    - html
    - pdf
    pit_value: 高（年度资产配置）；股票明细不由社保基金会完整公开
    notes: 官方年度报告至少可追溯至2001年。投资管理办法要求每年向社会公布财务状况、每季度向主管部门提交报告，但季度投资明细并非面向社会完整公开。
  A_SHARE_DISCLOSURE:
    name: A股上市公司定期报告/主要股东披露
    authority: 沪深北交易所及法定信息披露体系
    url: https://www.cninfo.com.cn/new/index
    access:
    - search
    - pdf
    - structured_extraction
    pit_value: 高但强滞后：股东数据是报告期末快照，必须以实际报告披露时间作为available_ts
    notes: 用于构造社保基金组合持仓。建议稳定主样本从2004Q3左右起；2003-2004可尽力回溯但披露一致性较弱。退出前十大不等于清仓，新进前十大不等于首次买入。
