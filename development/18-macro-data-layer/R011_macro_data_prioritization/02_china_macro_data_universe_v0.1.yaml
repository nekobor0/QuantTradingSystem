derived_feature_catalog:
- id: yoy
  formula: x_t / x_{t-12} - 1
  note: 月度；季度对应t-4
- id: mom
  formula: x_t / x_{t-1} - 1
  note: 必要时季调；原始累计值不可直接使用
- id: qoq_sa
  formula: 季调环比
  note: 优先使用官方季调；否则记录自建季调版本
- id: change
  formula: x_t - x_{t-1}
- id: acceleration
  formula: growth_t - growth_{t-1}
  note: 用于边际改善/恶化
- id: zscore
  formula: (x_t - rolling_mean) / rolling_std
  note: 只用历史窗口
- id: percentile
  formula: expanding_or_rolling_percentile
  note: 禁止使用全样本分位数回填历史
- id: 3m_ma
  formula: mean(x_t,x_{t-1},x_{t-2})
- id: 12m_sum
  formula: rolling_sum_12m(flow)
- id: single_month_implied
  formula: cum_t - cum_{t-1}
  note: 仅在统计口径允许时使用；样本范围变化序列需禁用
- id: credit_impulse
  formula: Δ(12m_new_credit / nominal_GDP)
  note: 定义必须版本化
- id: m1_m2_gap
  formula: M1_yoy - M2_yoy
- id: real_rate
  formula: nominal_rate - inflation_expectation_or_CPI
  note: 明确使用事后CPI还是实时预期
- id: term_spread_10y1y
  formula: gov10y - gov1y
- id: dr007_policy_gap
  formula: DR007 - OMO7D
- id: property_sales_price
  formula: sales_value / sales_area
  note: 仅作全国均价代理，结构效应强
- id: price_breadth_70city
  formula: share(city_mom>0)
  note: 新房/二手房分别计算
- id: macro_surprise
  formula: actual_release - consensus_before_release
  note: 需要另接实时一致预期数据；官方源本身不提供
- id: release_event_return
  formula: asset_return after release_ts over fixed window
  note: 用于事件研究而非月末对齐
- id: regime_growth
  formula: latent_factor(PMI,new_orders,industrial_va,credit,freight,...)
- id: regime_inflation
  formula: latent_factor(CPI_core,PPI,PMI_prices,...)
- id: regime_credit
  formula: latent_factor(TSF,M1,corp_ML_loans,credit_impulse,...)
- id: regime_liquidity
  formula: latent_factor(DR007,Shibor,policy_gap,yield_curve,...)
- id: regime_external
  formula: latent_factor(exports,FX settlement,crossborder flows,CNY,...)
- id: nssf_visibility_state
  formula: observable / censored / unknown
  note: 社保持仓研究必须先建可见性状态机
