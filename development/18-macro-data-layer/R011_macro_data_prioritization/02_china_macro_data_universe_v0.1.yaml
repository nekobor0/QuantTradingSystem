quality_gates:
- 每个序列记录first_non_null、last_non_null、missing_ratio、duplicate_count、revision_count。
- 每个序列至少抽样5个历史时点与官方原文人工/自动双重核验。
- release_ts缺失的观测不得进入严格PIT回测，只能进入exploratory标签数据集。
- 口径变更必须有break记录和测试用例。
- 截至2026-08-25的最新月份必须能与官方最新公告对齐，允许官方尚未发布造成的自然缺失。
- 所有派生因子必须有可复现formula/version，并验证不会读取未来vintage。
